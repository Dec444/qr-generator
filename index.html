<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiet Zone — QR code generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#E4E4DE;
    --surface:#FBFBF9;
    --ink:#18181B;
    --muted:#6B6B66;
    --line:#CFCFC8;
    --accent:#2440FF;
    --accent-press:#1B33D6;
    --radius:10px;
    --mono:'SF Mono','JetBrains Mono','Fira Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    min-height:100vh;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}

  /* Header */
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:var(--mono);font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:.26em;display:flex;align-items:center;gap:10px;
  }
  .wordmark .glyph{
    width:16px;height:16px;border:2px solid var(--ink);border-radius:3px;position:relative;flex:none;
  }
  .wordmark .glyph::after{content:"";position:absolute;inset:3px;background:var(--accent);border-radius:1px}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .divider{height:1px;background:var(--line);margin:22px 0}

  /* Type tabs */
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);
    cursor:pointer;transition:.12s;
  }
  .tab:hover{border-color:var(--ink);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  /* Inputs */
  .field{margin-top:14px}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=url],input[type=email],input[type=tel],input[type=password],textarea,select{
    width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;transition:.12s;
  }
  textarea{resize:vertical;min-height:84px;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,64,255,.16)}
  .row{display:flex;gap:12px}
  .row > *{flex:1;min-width:0}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .checkline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)}
  .checkline input{width:16px;height:16px;accent-color:var(--accent)}

  /* Style controls */
  .swatches{display:flex;gap:14px;flex-wrap:wrap}
  .swatch{display:flex;flex-direction:column;gap:6px}
  .swatch span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .swatch .picker{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
  .swatch input[type=color]{width:30px;height:30px;border:none;padding:0;background:none;cursor:pointer;border-radius:6px}
  .swatch .hex{font-family:var(--mono);font-size:12px;color:var(--ink)}

  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .preset{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;padding:0}
  .preset i{position:absolute;inset:0;display:block}
  .preset:hover{transform:scale(1.08)}
  .preset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:8px 13px;border:none;background:#fff;color:var(--muted);cursor:pointer;transition:.12s;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

  .ctrlrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .slider{display:flex;align-items:center;gap:10px;min-width:180px;flex:1}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .slider .val{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:34px;text-align:right}

  .logoctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
  .fbtn{
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 12px;border:1px dashed var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;transition:.12s;
  }
  .fbtn:hover{border-color:var(--accent);color:var(--accent)}
  .clearlogo{font-family:var(--mono);font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline}

  /* Output */
  .plate{
    position:relative;border-radius:var(--radius);padding:30px;display:flex;align-items:center;justify-content:center;
    min-height:300px;
    background-color:#fff;
    background-image:
      linear-gradient(45deg,#ededea 25%,transparent 25%),
      linear-gradient(-45deg,#ededea 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ededea 75%),
      linear-gradient(-45deg,transparent 75%,#ededea 75%);
    background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;
  }
  .plate::before,.plate::after,.bracket-tr,.bracket-br{
    content:"";position:absolute;width:18px;height:18px;border:2px solid var(--accent);
  }
  .plate::before{top:10px;left:10px;border-right:none;border-bottom:none;border-top-left-radius:3px}
  .plate::after{bottom:10px;left:10px;border-right:none;border-top:none;border-bottom-left-radius:3px}
  .bracket-tr{top:10px;right:10px;border-left:none;border-bottom:none;border-top-right-radius:3px}
  .bracket-br{bottom:10px;right:10px;border-left:none;border-top:none;border-bottom-right-radius:3px}
  #preview canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;border-radius:2px}
  .empty{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}

  .spec{
    margin-top:16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);
    display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;
  }
  .spec b{color:var(--ink);font-weight:600}
  .spec .k{color:var(--muted)}

  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{
    font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    padding:12px 16px;border-radius:9px;border:1px solid var(--accent);cursor:pointer;transition:.12s;
  }
  .btn.primary{background:var(--accent);color:#fff;flex:1}
  .btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.ghost:hover{background:rgba(36,64,255,.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .toast{font-family:var(--mono);font-size:11px;color:var(--accent);min-height:16px;margin-top:8px;letter-spacing:.04em}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="wordmark"><span class="glyph"></span>Quiet Zone</div>
    <div class="tag">QR code generator</div>
  </header>

  <div class="grid">
    <!-- CONSOLE -->
    <section class="panel" aria-label="Controls">
      <p class="label">Content</p>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-type="link" aria-selected="true">Link</button>
        <button class="tab" role="tab" data-type="text" aria-selected="false">Text</button>
        <button class="tab" role="tab" data-type="wifi" aria-selected="false">Wi-Fi</button>
        <button class="tab" role="tab" data-type="email" aria-selected="false">Email</button>
        <button class="tab" role="tab" data-type="phone" aria-selected="false">Phone</button>
        <button class="tab" role="tab" data-type="sms" aria-selected="false">SMS</button>
      </div>

      <div id="fields"><!-- dynamic --></div>

      <div class="divider"></div>

      <p class="label">Style</p>
      <div class="swatches">
        <div class="swatch">
          <span>Foreground</span>
          <div class="picker"><input type="color" id="fg" value="#18181B" /><span class="hex" id="fgHex">#18181B</span></div>
        </div>
        <div class="swatch">
          <span>Background</span>
          <div class="picker"><input type="color" id="bg" value="#FFFFFF" /><span class="hex" id="bgHex">#FFFFFF</span></div>
        </div>
      </div>
      <div class="presets" id="presets" aria-label="Color presets"></div>
      <label class="checkline"><input type="checkbox" id="transparent" /> Transparent background</label>

      <div class="divider"></div>

      <div class="ctrlrow">
        <div>
          <p class="label" style="margin-bottom:8px">Error correction</p>
          <div class="seg" id="ecc" role="group" aria-label="Error correction level">
            <button data-ecc="L" aria-pressed="false">L</button>
            <button data-ecc="M" aria-pressed="true">M</button>
            <button data-ecc="Q" aria-pressed="false">Q</button>
            <button data-ecc="H" aria-pressed="false">H</button>
          </div>
        </div>
        <div>
          <p class="label" style="margin-bottom:8px">Export size</p>
          <div class="seg" id="size" role="group" aria-label="Export size">
            <button data-size="512" aria-pressed="false">512</button>
            <button data-size="1024" aria-pressed="true">1024</button>
            <button data-size="2048" aria-pressed="false">2048</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="margin">Quiet zone (margin)</label>
        <div class="slider"><input type="range" id="margin" min="0" max="20" value="8" /><span class="val" id="marginVal">8%</span></div>
      </div>

      <div class="field">
        <label>Center logo (optional)</label>
        <div class="logoctrl">
          <button class="fbtn" id="logoBtn">Upload image</button>
          <input type="file" id="logoFile" accept="image/*" hidden />
          <span class="hint" id="logoName" style="margin-top:0"></span>
          <button class="clearlogo" id="logoClear" hidden>remove</button>
        </div>
        <p class="hint">Adding a logo forces the highest error correction so it still scans.</p>
      </div>
    </section>

    <!-- OUTPUT -->
    <section class="panel" aria-label="Result">
      <p class="label">Output</p>
      <div class="plate">
        <span class="bracket-tr"></span><span class="bracket-br"></span>
        <div id="preview"><div class="empty">Enter content to generate</div></div>
      </div>

      <div class="spec">
        <div><span class="k">type</span> · <b id="sType">—</b></div>
        <div><span class="k">chars</span> · <b id="sChars">0</b></div>
        <div><span class="k">ecc</span> · <b id="sEcc">M</b></div>
        <div><span class="k">size</span> · <b id="sSize">1024px</b></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="download" disabled>Download PNG</button>
        <button class="btn ghost" id="copy" disabled>Copy</button>
      </div>
      <div class="toast" id="toast"></div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";
  var state = { type:"link", ecc:"M", size:1024, margin:8, fg:"#18181B", bg:"#FFFFFF", transparent:false, logo:null };
  var outputCanvas = null;

  var $ = function(id){ return document.getElementById(id); };
  var fieldsEl = $("fields");

  // ---- Field templates per content type ----
  var templates = {
    link: '<div class="field"><label for="i_url">URL</label><input type="url" id="i_url" placeholder="https://example.com" autocomplete="off"></div>',
    text: '<div class="field"><label for="i_text">Plain text</label><textarea id="i_text" placeholder="Anything you want encoded"></textarea></div>',
    wifi: '<div class="field"><label for="i_ssid">Network name (SSID)</label><input type="text" id="i_ssid" placeholder="MyNetwork" autocomplete="off"></div>'
        + '<div class="field"><label for="i_pass">Password</label><input type="text" id="i_pass" placeholder="•••••••• (leave empty if open)" autocomplete="off"></div>'
        + '<div class="field"><label for="i_enc">Security</label><select id="i_enc"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">None (open)</option></select></div>'
        + '<label class="checkline"><input type="checkbox" id="i_hidden"> Hidden network</label>',
    email: '<div class="field"><label for="i_to">To</label><input type="email" id="i_to" placeholder="hello@example.com" autocomplete="off"></div>'
        + '<div class="field"><label for="i_subj">Subject</label><input type="text" id="i_subj" placeholder="Optional"></div>'
        + '<div class="field"><label for="i_body">Body</label><textarea id="i_body" placeholder="Optional"></textarea></div>',
    phone: '<div class="field"><label for="i_phone">Phone number</label><input type="tel" id="i_phone" placeholder="+1 555 010 1234" autocomplete="off"></div>',
    sms:  '<div class="field"><label for="i_sphone">Phone number</label><input type="tel" id="i_sphone" placeholder="+1 555 010 1234" autocomplete="off"></div>'
        + '<div class="field"><label for="i_smsg">Message</label><textarea id="i_smsg" placeholder="Optional pre-filled text"></textarea></div>'
  };

  function mountFields(){
    fieldsEl.innerHTML = templates[state.type];
    Array.prototype.forEach.call(fieldsEl.querySelectorAll("input,textarea,select"), function(el){
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
  }

  // ---- Encoders ----
  function esc(s){ return String(s).replace(/([\\;,:"])/g, "\\$1"); }
  function val(id){ var el = $(id); return el ? el.value.trim() : ""; }

  function buildContent(){
    switch(state.type){
      case "link":
        var u = val("i_url");
        if(!u) return "";
        if(!/^[a-z][a-z0-9+.-]*:/i.test(u) && /\./.test(u) && !/\s/.test(u)) u = "https://" + u;
        return u;
      case "text":
        return val("i_text");
      case "wifi":
        var ssid = val("i_ssid"); if(!ssid) return "";
        var enc = (($("i_enc")||{}).value) || "WPA";
        var pass = val("i_pass");
        var hidden = ($("i_hidden")||{}).checked ? "true" : "false";
        if(enc === "nopass") return "WIFI:T:nopass;S:" + esc(ssid) + ";H:" + hidden + ";;";
        return "WIFI:T:" + enc + ";S:" + esc(ssid) + ";P:" + esc(pass) + ";H:" + hidden + ";;";
      case "email":
        var to = val("i_to"); if(!to) return "";
        var subj = val("i_subj"), body = val("i_body"), q = [];
        if(subj) q.push("subject=" + encodeURIComponent(subj));
        if(body) q.push("body=" + encodeURIComponent(body));
        return "mailto:" + to + (q.length ? "?" + q.join("&") : "");
      case "phone":
        var p = val("i_phone"); return p ? "tel:" + p.replace(/\s+/g,"") : "";
      case "sms":
        var sp = val("i_sphone"); if(!sp) return "";
        var msg = val("i_smsg");
        return "SMSTO:" + sp.replace(/\s+/g,"") + ":" + msg;
    }
    return "";
  }

  // ---- Render pipeline ----
  function effectiveEcc(){ return state.logo ? "H" : state.ecc; }

  function render(){
    var content = buildContent();
    var preview = $("preview");
    var dl = $("download"), cp = $("copy");

    $("sType").textContent = state.type;
    $("sChars").textContent = content.length;
    $("sEcc").textContent = effectiveEcc() + (state.logo ? " (logo)" : "");
    $("sSize").textContent = state.size + "px";

    if(!content){
      preview.innerHTML = '<div class="empty">Enter content to generate</div>';
      outputCanvas = null; dl.disabled = true; cp.disabled = true;
      return;
    }

    var gen = state.size;
    var tmp = document.createElement("div");
    try{
      new QRCode(tmp, {
        text: content,
        width: gen, height: gen,
        colorDark: state.fg,
        colorLight: state.transparent ? "rgba(0,0,0,0)" : state.bg,
        correctLevel: QRCode.CorrectLevel[effectiveEcc()]
      });
    }catch(e){
      preview.innerHTML = '<div class="empty">Content too long for one QR — shorten it</div>';
      outputCanvas = null; dl.disabled = true; cp.disabled = true;
      return;
    }

    var qrCanvas = tmp.querySelector("canvas");
    if(!qrCanvas){ return; }

    var pad = Math.round(gen * (state.margin/100));
    var out = document.createElement("canvas");
    out.width = gen + pad*2; out.height = gen + pad*2;
    var ctx = out.getContext("2d");
    if(!state.transparent){ ctx.fillStyle = state.bg; ctx.fillRect(0,0,out.width,out.height); }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(qrCanvas, pad, pad, gen, gen);

    if(state.logo){
      var ls = Math.round(gen * 0.22);
      var lx = pad + (gen - ls)/2, ly = pad + (gen - ls)/2;
      var padBox = Math.round(ls * 0.14);
      ctx.fillStyle = state.transparent ? "#FFFFFF" : state.bg;
      roundRect(ctx, lx - padBox, ly - padBox, ls + padBox*2, ls + padBox*2, Math.round(ls*0.12));
      ctx.fill();
      try{ ctx.drawImage(state.logo, lx, ly, ls, ls); }catch(e){}
    }

    preview.innerHTML = "";
    preview.appendChild(out);
    outputCanvas = out;
    dl.disabled = false; cp.disabled = false;
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---- Wiring ----
  // tabs
  $("tabs").addEventListener("click", function(e){
    var t = e.target.closest(".tab"); if(!t) return;
    state.type = t.getAttribute("data-type");
    Array.prototype.forEach.call(this.querySelectorAll(".tab"), function(b){
      b.setAttribute("aria-selected", b === t ? "true" : "false");
    });
    mountFields(); render();
  });

  // colors
  function syncHex(){ $("fgHex").textContent = state.fg.toUpperCase(); $("bgHex").textContent = state.bg.toUpperCase(); }
  $("fg").addEventListener("input", function(){ state.fg = this.value; syncHex(); render(); });
  $("bg").addEventListener("input", function(){ state.bg = this.value; syncHex(); render(); });
  $("transparent").addEventListener("change", function(){ state.transparent = this.checked; render(); });

  // presets
  var presetPairs = [
    ["#18181B","#FFFFFF"], ["#2440FF","#FFFFFF"], ["#0B6E4F","#F2FBF6"],
    ["#B3093C","#FFF4F7"], ["#FFFFFF","#18181B"], ["#3A2E1F","#F4ECD9"]
  ];
  (function buildPresets(){
    var c = $("presets");
    presetPairs.forEach(function(p){
      var b = document.createElement("button");
      b.className = "preset"; b.title = p[0] + " on " + p[1];
      b.innerHTML = '<i style="background:linear-gradient(135deg,'+p[1]+' 0 50%,'+p[0]+' 50% 100%)"></i>';
      b.addEventListener("click", function(){
        state.fg = p[0]; state.bg = p[1]; state.transparent = false;
        $("fg").value = p[0]; $("bg").value = p[1]; $("transparent").checked = false;
        syncHex(); render();
      });
      c.appendChild(b);
    });
  })();

  // ecc + size segmented
  $("ecc").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.ecc = b.getAttribute("data-ecc");
    Array.prototype.forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    render();
  });
  $("size").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.size = parseInt(b.getAttribute("data-size"),10);
    Array.prototype.forEach.call(this.children, function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    render();
  });

  // margin
  $("margin").addEventListener("input", function(){
    state.margin = parseInt(this.value,10);
    $("marginVal").textContent = state.margin + "%";
    render();
  });

  // logo
  $("logoBtn").addEventListener("click", function(){ $("logoFile").click(); });
  $("logoFile").addEventListener("change", function(){
    var f = this.files && this.files[0]; if(!f) return;
    var img = new Image();
    img.onload = function(){
      state.logo = img;
      $("logoName").textContent = f.name.length > 22 ? f.name.slice(0,20)+"…" : f.name;
      $("logoClear").hidden = false;
      // reflect forced ECC visually
      Array.prototype.forEach.call($("ecc").children, function(x){ x.setAttribute("aria-pressed", x.getAttribute("data-ecc")==="H"?"true":"false"); });
      render();
    };
    img.src = URL.createObjectURL(f);
  });
  $("logoClear").addEventListener("click", function(){
    state.logo = null; $("logoName").textContent = ""; this.hidden = true; $("logoFile").value = "";
    Array.prototype.forEach.call($("ecc").children, function(x){ x.setAttribute("aria-pressed", x.getAttribute("data-ecc")===state.ecc?"true":"false"); });
    render();
  });

  // download + copy
  function filename(){ return "qr-" + state.type + "-" + Date.now() + ".png"; }
  $("download").addEventListener("click", function(){
    if(!outputCanvas) return;
    var a = document.createElement("a");
    a.href = outputCanvas.toDataURL("image/png");
    a.download = filename();
    document.body.appendChild(a); a.click(); a.remove();
    toast("Saved " + filename());
  });
  $("copy").addEventListener("click", function(){
    if(!outputCanvas) return;
    if(!navigator.clipboard || !window.ClipboardItem){ toast("Clipboard not supported — use download"); return; }
    outputCanvas.toBlob(function(blob){
      navigator.clipboard.write([new ClipboardItem({"image/png":blob})])
        .then(function(){ toast("Copied to clipboard"); })
        .catch(function(){ toast("Copy blocked — use download"); });
    });
  });
  var toastTimer;
  function toast(msg){ var t = $("toast"); t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.textContent=""; }, 2600); }

  // init
  mountFields();
  syncHex();
  render();
})();
</script>
</body>
</html>
